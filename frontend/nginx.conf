server {
  listen 80;
  root /usr/share/nginx/html;

  # Les appels /api/... sont transmis au conteneur backend (réseau interne Compose)
  location /api/ {
    proxy_pass http://backend:8080/;
  }

  # Application Angular (SPA) : toute route inconnue renvoie index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
