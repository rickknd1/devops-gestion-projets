# Monitoring de la chaîne DevOps : Prometheus (collecte) + Grafana (tableaux de bord)
# Lancement dans la VM :  cd monitoring && docker compose up -d
# Variable attendue (fichier .env local, jamais commité) : GRAFANA_ADMIN_PASSWORD
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: mon-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d   # 7 jours d'historique : le disque de la VM est limité
      - --web.enable-lifecycle             # permet de recharger la config sans redémarrer
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - monitoring
      - minikube   # pour joindre le NodePort du cluster (192.168.49.2), isolé des autres réseaux Docker

  grafana:
    image: grafana/grafana:latest
    container_name: mon-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?définir GRAFANA_ADMIN_PASSWORD dans monitoring/.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - monitoring

  # Métriques de la VM elle-même : CPU, RAM, disque, réseau
  node-exporter:
    image: prom/node-exporter:latest
    container_name: mon-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks:
      - monitoring

  # Métriques par conteneur : Jenkins livre gp-*, SonarQube, minikube...
  # >= v0.54.1 obligatoire avec Docker 29 (image store containerd) : avant, aucun conteneur n'est nommé
  # Les nouvelles versions sont publiées sur ghcr.io, plus sur gcr.io
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: mon-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8085:8080"   # 8080 est pris par Jenkins
    networks:
      - monitoring

volumes:
  prometheus-data:
  grafana-data:

networks:
  monitoring:
  minikube:
    external: true   # réseau créé par "minikube start"
